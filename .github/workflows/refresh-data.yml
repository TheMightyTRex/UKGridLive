# Asks the live site to fetch whatever data is due (cron/run-due.php).
# The hosting package has no cron, so GitHub's servers do the timing.
# Runs alongside the Docker container in docker/ and the site's own
# page-load refresh: all three use the same "is it due?" record and the
# same locks, so they never fetch the same source twice at once.
#
# Set up once (GitHub > this repo > Settings > Secrets and variables >
# Actions > New repository secret):
#   UKGRID_SITE_URL     https://ukgridlive.info
#   UKGRID_CRON_SECRET  the same value as 'cron_http_secret' in includes/config.php
#
# Schedule: every 30 minutes keeps a PRIVATE repo inside GitHub's free
# 2,000 Actions minutes a month (each run is billed as at least 1 minute).
# A PUBLIC repo has free minutes for this, so you can change it to
# "*/5 * * * *". GitHub may start scheduled runs a few minutes late.
name: Refresh site data

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask the site to fetch whatever is due
        env:
          SITE_URL: ${{ secrets.UKGRID_SITE_URL }}
          CRON_SECRET: ${{ secrets.UKGRID_CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Add the UKGRID_SITE_URL and UKGRID_CRON_SECRET repository secrets first."
            exit 1
          fi
          code=$(curl --silent --show-error --max-time 120 -o response.txt -w "%{http_code}" \
            -H "X-Cron-Secret: $CRON_SECRET" \
            -H "User-Agent: ukgridlive-scheduler/github" \
            --data-urlencode "secret=$CRON_SECRET" \
            "${SITE_URL%/}/cron/run-due.php?caller=github") || code="000"
          echo "HTTP status: $code"
          cat response.txt 2>/dev/null; echo
          # A PHP error after the first line has gone out can't change the
          # status any more, so a 200 is only a pass if the reply ends "done".
          if [ "$code" = "200" ] && ! grep -q "^done in" response.txt; then
            echo "The run started but did not finish (see the reply above). If it names a missing function, upload the whole includes/ folder from the latest zip."
            exit 1
          fi
          case "$code" in
            200) exit 0 ;;
            000) echo "Could not reach the site at all (address wrong, or the site is down)." ;;
            403) echo "Forbidden: check cron_http_secret is set in includes/config.php on the server, and that UKGRID_CRON_SECRET is exactly the same value (no spaces)." ;;
            404) echo "Not found: upload cron/run-due.php to the server, and check UKGRID_SITE_URL (for example https://ukgridlive.info)." ;;
            5*)  echo "Server error: see includes/refresh.log on the server." ;;
            *)   echo "Unexpected response from the site." ;;
          esac
          exit 1
